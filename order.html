<!DOCTYPE html>
<html>
<head>
<title>Orders</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

.order{
background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
}

.status{
color:green;
font-weight:bold;
}

.timeline{
margin-top:20px;
line-height:40px;
font-size:20px;
}

</style>

</head>

<body>

<h1>My Orders</h1>

<div id="orders"></div>

<script>

let orders =
JSON.parse(
localStorage.getItem("orders")
)||[];

let html="";

orders.forEach(item=>{

html += `
<div class="order">

<h3>${item.name}</h3>

<p>Price : ₹${item.price}</p>

<p class="status">
✔ Confirmed
</p>

<div class="timeline">
🍴 Restaurant<br>
⬇<br>
📦 Preparing<br>
⬇<br>
🛵 Out For Delivery<br>
⬇<br>
🏠 Delivered
</div>

</div>
`;

});

document.getElementById(
"orders"
).innerHTML = html;

</script>

</body>
</html>
