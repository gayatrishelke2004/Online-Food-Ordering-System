<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
    <style>
        body{
            font-family:Arial;
            background:#f5f5f5;
        }

        table{
            width:80%;
            margin:auto;
            background:white;
            border-collapse:collapse;
        }

        th,td{
            padding:15px;
            border:1px solid rgb(172, 25, 25);
            text-align:center;
        }

        h1{
            text-align:center;
        }

        button{
            display:block;
            margin:20px auto;
            background:#5e2e1c;
            color:rgba(255, 255, 255, 0.756);
            border:none;
            padding:10px 20px;
            cursor:pointer;
        }
    </style>
</head>
<body>

<h1>My Cart</h1>

<table id="cartTable">
    <tr>
        <th>Food</th>
        <th>Price</th>
    </tr>
</table>

<h2 id="total" style="text-align:center"></h2>

<button onclick="placeOrder()">
Place Order
</button>

<script>

let cart =
JSON.parse(localStorage.getItem("cart"))
|| [];

let total = 0;

cart.forEach(item=>{

total += item.price;

document.getElementById(
"cartTable"
).innerHTML +=

`<tr>
<td>${item.name}</td>
<td>₹${item.price}</td>
</tr>`;

});

document.getElementById(
"total"
).innerHTML = "Total = ₹" + total;

function placeOrder(){

localStorage.setItem(
"orders",
JSON.stringify(cart)
);

localStorage.removeItem("cart");

alert("Order Placed");

window.location.href="orders.html";
}

</script>

</body>
</html>
